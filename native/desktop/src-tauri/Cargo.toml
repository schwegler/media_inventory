[package]
name = "media-inventory-desktop"
version = "1.0.0"
edition = "2021"
description = "Media Inventory desktop app"
authors = []
default-run = "media-inventory-desktop"

[lib]
name = "media_inventory_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = [] }
tauri-plugin-shell = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
