<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Inventory</title>
  <style>
    :root { color-scheme: light dark; --canvas: #fafafa; --text: #17151b; --muted: #5f5967; --border: #ddd8e2; --accent: #654098; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) { :root { --canvas: #111113; --text: #f5f3f7; --muted: #c0bbc6; --border: #3a363f; --accent: #c5adff; --on-accent: #17131e; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--canvas);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--text);
    }
    p {
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button {
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button { min-height: 44px; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Media Inventory</h1>
    <p role="status">Connecting to server...<br>Make sure the Rails server is running on localhost:3000</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
  <script>
    // Auto-retry connection every 3 seconds
    const checkServer = async () => {
      try {
        const res = await fetch('http://localhost:3000', { mode: 'no-cors' });
        window.location.href = 'http://localhost:3000';
      } catch (e) {
        setTimeout(checkServer, 3000);
      }
    };
    setTimeout(checkServer, 2000);
  </script>
</body>
</html>
