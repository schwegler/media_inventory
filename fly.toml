# fly.toml app configuration file generated for media-inventory on 2026-06-20T01:36:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'media-inventory'
primary_region = 'iad'
console_command = '/rails/bin/rails console'
# Fly swap is a machine-level setting, outside [[vm]].
swap_size_mb = 512

[build]

[deploy]
  release_command = './bin/rails db:prepare'

[env]
  DATABASE_URL = 'sqlite3:///data/production.sqlite3'
  RAILS_MAX_THREADS = '3'
  RAILS_MIN_THREADS = '1'
  MEDIA_IMPORT_THREADS = '1'
  RAILS_CACHE_PATH = '/data/cache'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  guest_path = '/rails/public'
  url_prefix = '/'
