<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove Shelf — proposed experience</title>
<style>
:root{--ink:#183c36;--paper:#fbf4e4;--line:#c5c4b4;--accent:#aa2942;--panel:#fffaf0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a.button{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 16px;background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:hover{border-color:var(--ink)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.quiet{border-color:transparent;background:transparent}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3{font-family:Georgia,serif;font-weight:500;line-height:1.15}h1{font-size:clamp(2rem,5vw,3.5rem);margin:16px 0}h2{font-size:1.8rem}h3{font-size:1.3rem}p{max-width:70ch}.banner{padding:10px 24px;background:#183c36;color:white;font-size:13px}.site{max-width:1200px;margin:auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:24px}.site nav,.actions,.tabs,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}main{max-width:1200px;margin:auto;padding:30px 28px 130px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:700}.muted,small{color:#51645e}.annotation{font-size:13px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--panel);margin:18px 0}.heading{display:flex;justify-content:space-between;gap:24px;align-items:center}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}.card h2{margin:14px 0}.mini{display:flex;align-items:flex-end;gap:12px;min-height:150px}.mini .jacket{width:24%;font-size:12px}.jacket{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;background:var(--jacket,#27554e);color:white;font:600 clamp(13px,2vw,22px)/1.3 Georgia,serif;box-shadow:0 5px 12px #132b2726;overflow-wrap:anywhere}.jacket.square{aspect-ratio:1}.jacket.wide{aspect-ratio:4/3}.jacket.missing{background:repeating-linear-gradient(45deg,#dedfda,#dedfda 8px,#eaebe5 8px,#eaebe5 16px);color:#354e46;border:1px dashed #61736b}.tabs{border-bottom:1px solid var(--line);margin:24px 0;padding-bottom:12px}.tabs [aria-current=page]{background:var(--ink);color:var(--paper)}.editor-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:24px}.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}.pick{min-width:0}.pick h3{font:600 15px/1.4 system-ui;margin:12px 0 5px}.pick small{display:block;margin:8px 0}.pick .tools{gap:4px}.pick .tools button{padding:8px;min-width:44px;font-size:13px}.composition{border:1px solid var(--line);border-radius:12px;padding:28px;background:var(--paper)}.composition .picks{gap:24px}.composition.mixtape .pick:nth-child(odd) .jacket{transform:rotate(-2deg)}.composition.mixtape .pick:nth-child(even) .jacket{transform:rotate(2deg)}.composition.paper{background-image:radial-gradient(#183c3625 .6px,transparent .6px);background-size:7px 7px}.composition.stars{background-image:radial-gradient(#a4264055 1px,transparent 1px);background-size:25px 25px}.form-field{display:block;margin:0 0 20px}.form-field>span{font-weight:600;display:block;margin-bottom:7px}input,textarea,select{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-height:44px}input[type=checkbox]{width:auto;display:inline-block;min-height:0}fieldset{border:0;margin:0 0 20px;padding:0}legend{font-weight:600;margin-bottom:8px}.sticky{position:fixed;bottom:0;left:0;right:0;z-index:3;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 16px #0001}.sticky>div{max-width:1200px;margin:auto;padding:12px 28px;display:flex;gap:16px;align-items:center;justify-content:space-between}.sticky p{margin:0}.state{font-size:14px}.error{color:#a1233e;font-weight:600}.empty{text-align:center;padding:50px 22px;border:1px dashed var(--line);border-radius:12px;margin:20px 0}.empty p{margin-inline:auto}.visitor .composition{max-width:1000px;margin:28px auto}.visitor .picks{grid-template-columns:repeat(3,minmax(0,1fr))}.visitor .context{font-size:20px}.badge{font-size:12px;padding:5px 9px;border-radius:99px;background:#e3e8dd}.save-note{font-size:13px}.preview-card{max-width:250px;margin:18px auto;padding:24px 18px;background:var(--paper);border:1px solid var(--line);aspect-ratio:9/16;display:flex;flex-direction:column;justify-content:space-around}.preview-card.landscape{max-width:100%;aspect-ratio:1200/630}.preview-card h3{font-size:21px}.preview-card .mini{min-height:0;gap:8px}.preview-card .jacket{font-size:11px;min-height:60px}.preview-card footer{font-size:10px}.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}dialog{color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;max-width:min(850px,calc(100vw - 24px));width:850px;padding:28px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#10282499}.dialog-head{display:flex;justify-content:space-between;gap:20px;align-items:center}.dialog-head h2{margin:0}.results{display:grid;gap:10px;margin:18px 0}.result{display:flex;text-align:left;justify-content:space-between}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}summary{cursor:pointer;padding:10px 0;min-height:44px}.example-bar{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px}.companion{font-size:13px;padding:8px;border:1px dashed var(--line);border-radius:6px;display:inline-block}.caption{font-size:13px;max-width:50ch}.status{min-height:24px;overflow-wrap:anywhere}.back{margin:0 0 18px}.scope{font-size:14px;padding:12px;background:#dce6de}.favorite-row{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding:16px 0}.favorite-row h3{margin:0}.editor-aside{position:sticky;top:20px;align-self:start}svg{max-width:100%}@media(max-width:760px){.site{padding:14px 16px}.site nav{font-size:13px}.site nav button{padding:8px}.heading{align-items:flex-start;flex-direction:column;gap:10px}main{padding:22px 16px 160px}.cards,.editor-grid,.share-grid{grid-template-columns:1fr}.picks,.visitor .picks{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.panel,.composition{padding:18px}.mini{min-height:120px}.sticky>div{padding:12px 16px;align-items:flex-start;flex-direction:column;gap:8px}.sticky .actions{width:100%}.editor-aside{position:static}.banner{padding:8px 16px}.tabs button{flex:1;padding:10px}.favorite-row{align-items:flex-start}.visitor .context{font-size:17px}.share-grid .panel{padding:14px}}@media(max-width:350px){.picks,.visitor .picks{grid-template-columns:1fr}.site{align-items:flex-start;flex-direction:column}.sticky .actions button{padding:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<body><div class="banner">DESIGN PROTOTYPE · Simulated data and behavior · No Trove account or production writes · Reload resets the demo</div><header class="site"><span class="brand">◈ trove</span><nav aria-label="Prototype"><button data-do="manage">Manage shelves</button><button data-do="public">Public shelves</button><a href="audit.html">Read audit</a></nav></header><main id="main" tabindex="-1"></main><div id="savebar" class="sticky" hidden></div><dialog id="picker" aria-labelledby="picker-title"></dialog><dialog id="share" aria-labelledby="share-title"></dialog><dialog id="create" aria-labelledby="create-title"></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catalog=[{title:'Songs for the Longest Night',type:'Album',shape:'square',color:'#227567'},{title:'A Very Unlikely Christmas',type:'Movie',shape:'',color:'#a53646'},{title:'The House at Winter’s Edge',type:'Book',shape:'',color:'#213953'},{title:'The Midnight Kitchen',type:'TV show',shape:'wide',color:'#805731'},{title:'Lanterns in the Snow',type:'Game',shape:'',color:'#57456c'},{title:'Small Everyday Wonders',type:'Book',shape:'',color:'#aa653c'},{title:'Sunday, Side A',type:'Album',shape:'square',color:'#3f6585'},{title:'An Ordinary Adventure',type:'Comic',shape:'',color:'#55713b'},{title:'Artwork unavailable',type:'Movie',shape:'missing',color:'#aaa'}].map((p,i)=>({...p,id:i+1}));
const clone=x=>structuredClone(x);const examples={christmas:{id:'winter-demo',title:'x-mas picks…',description:'A few things that make a winter night feel like home.',theme:'christmas',layout:'mixtape',texture:'paper',companion:'auto',picks:[1,2,3,4,5]},everyday:{id:'everyday-demo',title:'Things I keep coming back to',description:'Everyday comforts across books, music and stories.',theme:'everyday',layout:'exhibition',texture:'clean',companion:'facet',picks:[6,7,8]}};
let saved=clone(examples.christmas),draft=clone(saved),page='manage',tab='content',newUser=false,published=false,failed=false,status='All changes saved.',lastFocus,format='portrait',source='local';
const dirty=()=>JSON.stringify(draft)!==JSON.stringify(saved);const colors={christmas:['#fbf4e4','#183c36','#aa2942'],everyday:['#f0f2eb','#244239','#3c6654'],midnight:['#19242d','#f3eee0','#b7d2cd']};
function palette(){const c=colors[draft.theme]||colors.everyday;document.documentElement.style.setProperty('--paper',c[0]);document.documentElement.style.setProperty('--ink',c[1]);document.documentElement.style.setProperty('--accent',c[2]);document.documentElement.style.setProperty('--panel',draft.theme==='midnight'?'#24333d':'#fffaf0')}
function jacket(id){const p=catalog.find(x=>x.id===id);return `<div class="jacket ${p.shape}" style="--jacket:${p.color}" role="img" aria-label="Synthetic ${p.type} cover: ${esc(p.title)}">${esc(p.title)}</div>`}
function mini(state){return `<div class="mini">${state.picks.slice(0,4).map(jacket).join('')}</div>`}
function note(n,text){return `<aside class="annotation"><strong>${n} · Design note.</strong> ${text}</aside>`}
function picks(edit=false){if(!draft.picks.length)return `<div class="empty"><h2>A shelf taking shape.</h2><p>${edit?'Add your first title. Pick something that belongs here; you can arrange it later.':'No selections yet. Come back soon for a few discoveries.'}</p>${edit?'<button class="primary" data-do="add">Add a title</button>':''}</div>`;return `<div class="picks">${draft.picks.map((id,i)=>{const p=catalog.find(x=>x.id===id);return `<article class="pick">${jacket(id)}<small>${i+1} / ${p.type}</small><h3>${esc(p.title)}</h3>${edit?`<div class="tools"><button data-do="up" data-id="${id}" aria-label="Move ${esc(p.title)} earlier" ${i===0?'disabled':''}>←</button><button data-do="down" data-id="${id}" aria-label="Move ${esc(p.title)} later" ${i===draft.picks.length-1?'disabled':''}>→</button><button data-do="remove" data-id="${id}" aria-label="Remove ${esc(p.title)}">Remove</button></div>`:''}</article>`}).join('')}</div>`}
function bar(){const b=$('#savebar');b.hidden=page!=='edit';if(b.hidden)return;b.innerHTML=`<div><div><strong>${dirty()?'Unsaved changes':'Saved public version'}</strong><p class="state ${failed?'error':''}" role="status">${esc(status)}</p></div><div class="actions"><button data-do="undo" ${!dirty()?'disabled':''}>Undo changes</button><button class="primary" data-do="save" ${!dirty()?'disabled':''}>${failed?'Try saving again':'Save changes'}</button></div></div>`}
function nav(next,nextTab='content',push=true){if(next==='manage'&&page==='edit'&&dirty()&&!confirm('Discard unsaved changes and return to Manage shelves?'))return;if(next==='manage'&&page==='edit')draft=clone(saved);page=next;tab=nextTab;if(push)history.pushState({page,tab},'',`${location.href.split('#')[0]}#${page}${page==='edit'?'-'+tab:''}`);render();$('#main').focus()}
function render(){palette();let html='';if(page==='manage'){html=`<div class="heading"><div><span class="eyebrow">Your workspace</span><h1>Manage shelves</h1><p>Bring together the works that mean something to you.</p></div><button class="primary" data-do="create">Create shelf</button></div>${note(1,'Named shelves hold a theme or mood. Favorites are independent, concise lists. Neither changes library ownership or tracking.')}<div class="example-bar"><label><input type="checkbox" id="new-user" ${newUser?'checked':''}> Show new-owner state</label><button data-do="christmas">Christmas / Mixtape example</button><button data-do="everyday">Everyday example</button></div><h2>Your shelves</h2>${newUser?'<div class="empty"><h2>Your first shelf starts here.</h2><p>Make a shelf about something you love. Start with a title and a few works; appearance can wait.</p><button class="primary" data-do="create">Create your first shelf</button></div>':`<div class="cards"><article class="card">${mini(saved)}<h2>${esc(saved.title)}</h2><p>${esc(saved.description)}</p><p class="muted">${saved.picks.length} titles · ${saved.theme} · Public</p><div class="actions"><button class="primary" data-do="edit">Edit shelf</button><button data-do="view">View public shelf</button></div></article><article class="card"><span class="eyebrow">Start something new</span><h2>A mood, a season, a part of your life.</h2><p>Films, books, albums, shows, comics and games can live together.</p><button data-do="create">Create shelf</button></article></div>`}<h2>All-time favorites</h2><p>Up to five picks in each list. Your mixed favorites are chosen separately from media favorites.</p><div class="favorite-row"><div><h3>Across all media</h3><small>${newUser?'No picks yet':'Demo favorite list'} · independent from your named shelves</small></div><button data-do="favorites">Choose favorites</button></div><details><summary>Media favorites and archive</summary><p>Movies · TV shows · Albums · Books · Comics · Games</p><p class="caption">In production each opens its existing five-pick editor. Archived collections retain their selections and stable URL. This prototype concentrates on the named-shelf journey.</p></details>`}
else if(page==='edit'){html=`<button class="quiet back" data-do="manage">← Manage shelves</button><div class="heading"><div><span class="eyebrow">Editing one shelf · Public after saving</span><h1>${esc(draft.title)}</h1><p>${esc(draft.description)}</p></div><button data-do="view">Preview as visitor</button></div><nav class="tabs" aria-label="Shelf editor">${['content','appearance','share'].map(t=>`<button data-do="tab" data-tab="${t}" ${tab===t?'aria-current="page"':''}>${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</nav>${tab==='content'?`<div class="heading"><div><h2>Choose what belongs here</h2><p>${draft.picks.length} titles · Up to 1,000 in production · Your order, not a derived ranking</p></div><button class="primary" data-do="add">Add titles</button></div>${note(2,'Selection is separate from owning or tracking a work. Earlier/later controls provide a keyboard alternative to dragging.')}<div class="composition">${picks(true)}</div><details><summary>Shelf details and advanced settings</summary><label class="form-field"><span>Shelf title</span><input name="title" maxlength="80" value="${esc(draft.title)}"></label><label class="form-field"><span>A little context</span><textarea name="description" maxlength="240">${esc(draft.description)}</textarea></label><p class="caption">Production settings keep allowed media types, overview cover count and archive separate from the first-use flow. Rename keeps the stable URL.</p></details>`:tab==='appearance'?`<p class="scope">Changes apply only to “${esc(draft.title)}”. Your favorites and other shelves stay as saved.</p>${note(3,'Start with a theme and layout. Keep advanced options available without forcing every decision. Save changes commits content and appearance together in the proposed API.')}<div class="editor-grid"><div class="composition ${draft.layout} ${draft.texture}"><h2>${esc(draft.title)}</h2>${picks()}<p class="companion">${draft.companion==='none'?'No mascot':draft.companion==='auto'?'Mascot matches the theme':esc(draft.companion)+' mascot'} · approved art in production</p></div><div class="panel editor-aside"><label class="form-field"><span>Theme</span><select name="theme">${['everyday','christmas','midnight'].map(t=>`<option ${draft.theme===t?'selected':''} value="${t}">${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></label><label class="form-field"><span>Layout</span><select name="layout"><option value="exhibition" ${draft.layout==='exhibition'?'selected':''}>Gallery — balanced covers</option><option value="mixtape" ${draft.layout==='mixtape'?'selected':''}>Mixtape — a relaxed collage</option></select></label><details><summary>More appearance</summary><label class="form-field"><span>Background</span><select name="texture">${['clean','paper','stars'].map(t=>`<option ${draft.texture===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="form-field"><span>Mascot</span><select name="companion">${['auto','none','telly','facet','bat'].map(t=>`<option ${draft.companion===t?'selected':''}>${t}</option>`).join('')}</select></label><p class="caption">These placeholders represent existing approved assets. All legacy choices remain supported in the implementation.</p></details><button data-do="reset">Reset appearance to Everyday defaults</button></div></div>`:`<h2>Share something you’re proud of</h2><p>Choose a profile link or make an image. Your shelf is already public once saved.</p>${note(5,'A profile link, an exported image and a published shelf-link preview have different destinations and persistence. Name each outcome explicitly.')}<div class="panel"><p><strong>${dirty()?'Save changes before sharing.':'Saved and ready to share.'}</strong></p><p>Images include the first ${Math.min(5,draft.picks.length)} of ${draft.picks.length} titles. The full shelf retains every selection.</p><button class="primary" data-do="share" ${dirty()?'disabled':''}>Open sharing options</button><p>Published shelf-link preview: <strong>${published?'Current':'Not published / needs update'}</strong></p></div>`}<div class="example-bar"><label><input type="checkbox" id="fail-save" ${failed?'checked':''}> Simulate one failed save</label><span>Save status and changes live only in this demo.</span></div>`}
else if(page==='public'){html=`<div class="heading"><div><span class="eyebrow">Demo curator / public shelves</span><h1>A few things worth sharing.</h1><p>Collections for a season, a mood, or the everyday.</p></div><button data-do="manage">Return to Manage shelves</button></div><div class="cards"><article class="card">${mini(saved)}<h2>${esc(saved.title)}</h2><p>${esc(saved.description)}</p><button class="primary" data-do="view">Explore shelf</button></article></div><h2>All-time favorites</h2><p>Independent picks across media. Named collections keep their own identity.</p>`}
else{html=`<div class="visitor"><div class="actions"><button data-do="public">← All shelves</button><button data-do="profile">View curator profile</button><button data-do="edit">Return to editing</button><button class="primary" data-do="share">Share & export</button></div>${note(4,'The finished work leads. Curator, collection title and context establish identity; editing stays a separate owner destination.')}<p class="eyebrow">A shelf by Demo curator</p><h1>${esc(saved.title)}</h1><p class="context">${esc(saved.description)}</p><p>${saved.picks.length} selections · Mixed media · Saved public version${dirty()?' (the unsaved draft stays in the editor)':''}</p><div class="composition ${saved.layout} ${saved.texture}">${(()=>{const d=draft;draft=saved;const out=picks();draft=d;return out})()}</div><p class="caption">Synthetic jackets demonstrate real-world square, portrait and landscape ratios. Production items link to their media detail pages.</p></div>`}
$('#main').innerHTML=html;bar()}
function mark(){status='Your changes are not saved yet.';published=false;bar()}
function openDialog(id,body){lastFocus=document.activeElement;$(id).innerHTML=body;$(id).showModal()}
for(const d of document.querySelectorAll('dialog'))d.addEventListener('close',()=>lastFocus?.isConnected&&lastFocus.focus());
function openPicker(){openDialog('#picker',`<div class="dialog-head"><h2 id="picker-title">Find a title</h2><button data-do="close">Close</button></div><p>Adds a selection to this shelf. It does not add ownership, ratings or tracking.</p><div class="actions"><button data-do="source" data-source="local" aria-pressed="${source==='local'}">Trove catalog</button><button data-do="source" data-source="external" aria-pressed="${source==='external'}">External catalog (simulated)</button></div><label class="form-field"><span>Search titles</span><input id="query" type="search" placeholder="Try ‘night’ or ‘everyday’" autofocus></label><label class="form-field"><span>Media type</span><select id="type"><option>All media</option>${['Movie','TV show','Book','Album','Comic','Game'].map(t=>`<option>${t}</option>`).join('')}</select></label><div class="results" id="results"></div><p class="caption">External discovery is simulated. Production continues to use signed import selections and never adds a LibraryItem.</p>`);results();$('#query').focus()}
function results(){const q=($('#query')?.value||'').toLowerCase(),type=$('#type')?.value;$('#results').innerHTML=catalog.filter(p=>p.title.toLowerCase().includes(q)&&(!type||type==='All media'||p.type===type)).map(p=>`<button class="result" data-do="select" data-id="${p.id}" ${draft.picks.includes(p.id)?'disabled':''}><span>${esc(p.title)}<small> · ${p.type}</small></span><span>${draft.picks.includes(p.id)?'Added':'+ Add'}</span></button>`).join('')||'<p role="status">No matches. Try a broader title or a different media type.</p>'}
function share(){if(page==='edit'&&dirty()){status='Save changes before sharing your public version.';bar();return}openDialog('#share',`<div class="dialog-head"><h2 id="share-title">Share “${esc(saved.title)}”</h2><button data-do="close">Close</button></div><div class="share-grid"><div><h3>Invite someone to your profile</h3><p>Copied links and the image footer open your profile, where people can explore your shelves.</p><label class="form-field"><span>Profile link (demo)</span><input id="profile-url" readonly value="https://example.test/@demo-curator"></label><div class="actions"><button class="primary" data-do="copy">Copy profile link</button><button data-do="native">Share profile (simulated)</button></div><p class="status" id="share-status" role="status"></p><hr><h3>Make an image</h3><label class="form-field"><span>Format</span><select id="format"><option value="portrait">Story · 1080 × 1920</option><option value="landscape">Landscape · 1200 × 630</option></select></label><p>First ${Math.min(saved.picks.length,5)} of ${saved.picks.length} titles. No changes to the shelf.</p><button data-do="download">Preview download outcome</button><p class="caption">This prototype explains the outcome; production uses Trove's existing canvas renderer and approved artwork.</p></div><div><div id="image-preview" class="preview-card"><span class="eyebrow">Trove / ${esc(saved.theme)}</span><h3>${esc(saved.title)}</h3>${mini(saved)}<footer>Demo curator · Visit the profile<br>example.test/@demo-curator</footer></div><h3>Shelf link preview</h3><p>This shelf is already public. Updating this landscape preview also refreshes its discovery eligibility; it does not change the profile link's preview.</p><p id="publication-status" role="status">${published?'Current for the saved version.':'Not published / needs update.'}</p><button data-do="publish">Update shelf link preview (simulated)</button></div></div>`)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-do]');if(!b)return;const action=b.dataset.do,id=+b.dataset.id;
if(['manage','public'].includes(action))nav(action);else if(action==='edit')nav('edit');else if(action==='view')nav('view');else if(action==='tab')nav('edit',b.dataset.tab);else if(action==='create')openDialog('#create',`<div class="dialog-head"><h2 id="create-title">Make room for something you love</h2><button data-do="close">Close</button></div><form id="create-form"><label class="form-field"><span>Shelf title</span><input name="new-title" maxlength="80" required placeholder="Something for a winter night" autofocus></label><label class="form-field"><span>A little context (optional)</span><textarea name="new-description" maxlength="240"></textarea></label><label class="form-field"><span>Starting mood</span><select name="new-theme"><option value="everyday">Everyday</option><option value="christmas">Christmas</option></select></label><p>Create the shelf, then add titles. You can change its appearance any time.</p><button class="primary" type="submit">Create shelf</button></form>`);
else if(['christmas','everyday'].includes(action)){saved=clone(examples[action]);draft=clone(saved);newUser=false;published=false;failed=false;status='All changes saved.';render()}
else if(action==='add')openPicker();else if(action==='close')b.closest('dialog').close();else if(action==='select'){draft.picks.push(id);mark();results();render()}
else if(action==='source'){source=b.dataset.source;$('#picker').close();openPicker()}
else if(action==='remove'){draft.picks=draft.picks.filter(i=>i!==id);mark();render();document.querySelector('[data-do=add]')?.focus()}
else if(['up','down'].includes(action)){const i=draft.picks.indexOf(id),j=i+(action==='up'?-1:1);[draft.picks[i],draft.picks[j]]=[draft.picks[j],draft.picks[i]];mark();render();document.querySelector(`[data-do=${action}][data-id="${id}"]:not(:disabled)`)?.focus()||document.querySelector(`[data-do=remove][data-id="${id}"]`)?.focus()}
else if(action==='save'){if(failed){failed=false;if($('#fail-save'))$('#fail-save').checked=false;status='Could not save. Your changes are still here. Try saving again.';bar();$('#savebar .state').classList.add('error')}else{saved=clone(draft);status='All changes saved. Visitors now see this version.';bar()}}
else if(action==='undo'){draft=clone(saved);failed=false;status='Changes undone. Saved version restored.';render()}
else if(action==='reset'){Object.assign(draft,{theme:'everyday',layout:'exhibition',texture:'clean',companion:'auto'});mark();render()}
else if(action==='share')share();else if(action==='copy'){try{await navigator.clipboard.writeText($('#profile-url').value);$('#share-status').textContent='Profile link copied (demo URL).'}catch{$('#profile-url').focus();$('#profile-url').select();$('#share-status').textContent='Clipboard unavailable. Select and copy the profile link above.'}}
else if(action==='native')$('#share-status').textContent='Native share canceled (simulated). Try again or copy the profile link.';
else if(action==='download')$('#share-status').textContent=`A ${format==='portrait'?'1080 × 1920 Story':'1200 × 630 landscape'} image would download with the first ${Math.min(saved.picks.length,5)} titles and your profile footer. Simulated; no file generated.`;
else if(action==='publish'){published=true;$('#publication-status').textContent='Preview current for the saved version (simulated). The shelf was already public.'}
else if(action==='profile')alert('The production action opens the curator’s canonical profile. This demo makes no external request.');else if(action==='favorites')alert('Favorites remain a separate five-pick editor. This prototype demonstrates the named-collection flow; no favorite data is changed.')});
document.addEventListener('input',e=>{if(e.target.id==='query')results();if(['title','description'].includes(e.target.name)){draft[e.target.name]=e.target.value;mark()}});
document.addEventListener('change',e=>{if(e.target.id==='type')results();else if(e.target.id==='format'){format=e.target.value;$('#image-preview').classList.toggle('landscape',format==='landscape')}else if(e.target.id==='new-user'){newUser=e.target.checked;render()}else if(e.target.id==='fail-save'){failed=e.target.checked;bar()}else if(['theme','layout','texture','companion'].includes(e.target.name)){draft[e.target.name]=e.target.value;mark();render();document.querySelector(`[name="${e.target.name}"]`)?.focus()}});
document.addEventListener('submit',e=>{if(e.target.id!=='create-form')return;e.preventDefault();const data=new FormData(e.target);saved={id:'new-demo',title:data.get('new-title'),description:data.get('new-description'),theme:data.get('new-theme'),layout:'exhibition',texture:'clean',companion:'auto',picks:[]};draft=clone(saved);newUser=false;published=false;failed=false;status='Shelf created. Add your first title.';$('#create').close();nav('edit')});
window.addEventListener('popstate',e=>{if(e.state){page=e.state.page;tab=e.state.tab;render();$('#main').focus()}});window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});history.replaceState({page,tab},'',`${location.href.split('#')[0]}#manage`);render();
</script></body></html>
