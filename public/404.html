<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dead air on this channel · Trove</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d0e;
      --card-bg: #151618;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-subtle: rgba(139, 92, 246, 0.14);
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }
    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(28px, 5vw, 48px);
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    .mascot-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }
    .mascot-image {
      max-height: 140px;
      width: auto;
      aspect-ratio: 281 / 498;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      color: var(--text);
    }
    p {
      color: var(--text-muted);
      font-size: clamp(15px, 2vw, 17px);
      margin-bottom: 28px;
    }
    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .search-input {
      flex: 1;
      min-height: 44px;
      background: #1c1d20;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0 14px;
      font-family: var(--font-body);
      font-size: 15px;
      transition: border-color 0.15s ease;
    }
    .search-input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: 1px solid transparent;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    @media (max-width: 480px) {
      .search-form {
        flex-direction: column;
      }
      .actions {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="error-card" role="main">
    <div class="mascot-container" aria-hidden="true">
      <img src="/brand/facet_pose_01_bookworm.png" class="mascot-image" width="140" height="248" alt="">
    </div>
    <h1>Dead air on this channel.</h1>
    <p>This page may have moved or doesn’t exist. Search the media vault or return to the catalog home.</p>
    <form class="search-form" action="/search" method="get" role="search">
      <input type="search" name="q" class="search-input" placeholder="Search movies, games, books…" aria-label="Search the vault" required>
      <button type="submit" class="btn btn-secondary">Search</button>
    </form>
    <div class="actions">
      <a href="/" class="btn btn-primary">Return to Trove</a>
      <a href="https://tacobout.online" class="btn btn-secondary" target="_blank" rel="noopener">Visit taco ’bout it ↗</a>
    </div>
  </main>
</body>
</html>
